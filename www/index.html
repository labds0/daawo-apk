<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داوو مرضاكم بالصدقة - برويش</title>
<link rel="manifest" href="manifest.json">
<style>
  @font-face{ font-family:'Cairo'; font-weight:400; font-style:normal; font-display:block; src:url("fonts/Cairo-Regular.ttf") format("truetype"); }
  @font-face{ font-family:'Cairo'; font-weight:500 600; font-style:normal; font-display:block; src:url("fonts/Cairo-SemiBold.ttf") format("truetype"); }
  @font-face{ font-family:'Cairo'; font-weight:700; font-style:normal; font-display:block; src:url("fonts/Cairo-Bold.ttf") format("truetype"); }
  @font-face{ font-family:'Cairo'; font-weight:800 900; font-style:normal; font-display:block; src:url("fonts/Cairo-ExtraBold.ttf") format("truetype"); }
</style>


<style>
  :root{
    --bg:#EBF5F0; --panel:#FFFFFF; --panel-2:#F0F7F3; --line:#DDEAE3;
    --gold:#1E7F57; --gold-dim:#176645; --text:#14302A; --muted:#5A786C; --muted-2:#8AA297;
    --danger:#D0533C; --success:#1E9B63; --info:#2E7DB8; --accent:#C9A24B;
    --shadow:0 4px 16px rgba(20,70,50,.07);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:460px; margin:0 auto; padding:0 14px 110px; }
  header{ position:relative; text-align:center; margin:0 -14px 10px; }
  header.auth{ padding:calc(env(safe-area-inset-top,0px) + 34px) 20px 6px; }
  header.auth .wm{ width:170px; display:block; margin:0 auto; }
  header.auth .tag{ font-size:14px; font-weight:800; color:var(--text); margin-top:2px; }
  header.hero{ background:linear-gradient(135deg,#1B7A52,#2B9D6E); color:#fff; border-radius:0 0 28px 28px; padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 58px; overflow:hidden; text-align:right; }
  header.hero.compact{ padding-bottom:16px; transition:padding .2s; }
  header.hero::before, header.hero::after{ content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none; }
  header.hero::before{ width:190px; height:190px; left:-60px; top:-70px; }
  header.hero::after{ width:130px; height:130px; right:-40px; bottom:-60px; }
  .hd-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; }
  .hd-user{ display:flex; align-items:center; gap:11px; min-width:0; }
  .avatar{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex:none; }
  .hd-name{ font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hd-sub{ font-size:11.5px; opacity:.85; margin-top:1px; display:flex; align-items:center; gap:6px; }
  .role-badge{ background:rgba(255,255,255,.2); border-radius:20px; padding:1px 9px; font-size:10.5px; }
  .hd-actions{ display:flex; gap:8px; flex:none; }
  .hd-btn{ width:38px; height:38px; border-radius:12px; border:none; background:rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .hd-btn svg{ width:19px; height:19px; }
  .hd-title{ position:relative; z-index:1; margin-top:14px; font-size:13px; font-weight:700; opacity:.92; }
  .home-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:-38px 0 4px; position:relative; z-index:2; }
  .hs{ background:#fff; border-radius:16px; padding:11px 6px; text-align:center; box-shadow:var(--shadow); border:1px solid var(--line); }
  .hs .l{ font-size:10.5px; color:var(--muted); margin-bottom:3px; font-weight:700; }
  .hs .v{ font-size:15px; font-weight:800; color:var(--gold); white-space:nowrap; }
  .hs.out .v{ color:var(--danger); } .hs.bal .v{ color:var(--text); }
  .ic svg, .h-ic svg, .ttl svg{ width:100%; height:100%; display:block; }
  .h-ic{ display:inline-block; width:17px; height:17px; vertical-align:-3px; margin-left:4px; color:var(--gold); }
  .navbar .ttl .t-ic{ display:inline-block; width:18px; height:18px; vertical-align:-3px; margin-left:5px; color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2{ margin:0 0 10px; font-size:13.5px; font-weight:800; color:var(--gold); }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:15px; padding:10px 12px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold-dim); }
  .full-btn{ width:100%; background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#fff; border:none; border-radius:12px; padding:11px; font-size:14.5px; font-weight:800; cursor:pointer; font-family:inherit; }
  .full-btn:disabled{ opacity:.5; }
  .btn-flat{ flex:1; background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-danger{ background:linear-gradient(180deg,var(--danger),#b85a48); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .row-actions{ display:flex; gap:8px; margin-top:10px; }
  .err{ font-size:12px; color:var(--danger); margin:4px 0; display:none; }

  .cat-filter{ display:flex; gap:6px; margin-bottom:12px; }
  .cat-filter button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:8px 2px; border-radius:10px; font-size:11.5px; font-weight:700; font-family:inherit; }
  .cat-filter button.active{ background:var(--gold); color:#fff; border-color:var(--gold); }

  .fund-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; }
  .fund-card .name{ font-weight:800; font-size:14.5px; }
  .fund-card .sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .fund-card .bal{ font-weight:800; font-size:15px; color:var(--gold); white-space:nowrap; }
  .fund-card.closed{ opacity:.55; }
  .empty{ text-align:center; color:var(--muted-2); font-size:12.5px; padding:16px 0; }

  .list{ max-height:360px; overflow-y:auto; }
  .tx-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-row .info{ display:flex; flex-direction:column; }
  .tx-row .who{ font-size:11.5px; color:var(--muted); }
  .tx-row .note{ font-size:11px; color:var(--muted-2); }
  .tx-row .amt{ font-weight:800; font-size:14.5px; white-space:nowrap; }
  .tx-row .amt.in{ color:var(--success); }
  .tx-row .amt.out{ color:var(--danger); }

  .back-btn{ background:none; border:none; color:var(--gold); font-size:13px; font-weight:700; cursor:pointer; margin-bottom:10px; padding:4px 0; font-family:inherit; }
  .user-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line); }
  .user-row:last-child{ border-bottom:none; }
  .user-row .nm{ font-weight:700; font-size:13.5px; }
  .user-row .meta{ font-size:11px; color:var(--muted); }
  .pill{ font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .pill.admin{ color:var(--gold); border-color:var(--gold-dim); }
  .pill.supervisor{ color:var(--info); border-color:var(--info); }
  .pill.employee{ color:var(--success); border-color:var(--success); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; z-index:100; }
  .modal{ width:100%; max-width:380px; max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .modal h3{ margin:0 0 12px; font-size:15px; color:var(--gold); }
  .hint{ font-size:11px; color:var(--muted-2); text-align:center; margin:4px 0 2px; line-height:1.6; }
  .loading{ text-align:center; padding:30px 0; color:var(--muted); font-size:13px; }
  .stat-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .stat .l{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .stat .v{ font-size:18px; font-weight:800; color:var(--gold); }
  footer{ text-align:center; font-size:10.5px; color:var(--muted-2); margin-top:6px; }

  .chk{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; }
  .chk input{ width:18px; height:18px; accent-color:var(--gold); flex:none; margin:0; }
  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:300; max-width:90%; text-align:center; }
  .mini-btn{ background:transparent; border:1px solid var(--line); color:var(--gold); border-radius:8px; padding:3px 9px; font-size:10.5px; font-family:inherit; cursor:pointer; margin-top:4px; }
  .btns{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .busy{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:400; color:#fff; font-size:14px; padding:20px; text-align:center; }

  .tx-row.deleted{ opacity:.75; background:rgba(200,80,60,.07); }
  .tx-row.deleted .amt, .tx-row.deleted .nt{ text-decoration:line-through; }
  .tx-row .info{ flex:1; min-width:0; }
  .tx-meta{ font-size:10.5px; color:var(--muted-2); margin-top:2px; line-height:1.5; }
  .tx-meta.del{ color:var(--danger); }
  .mini-del{ color:var(--danger); border-color:var(--danger); }
  .pill.bad{ color:var(--danger); border-color:var(--danger); }
  .pill.good{ color:var(--success); border-color:var(--success); }
  .sub-title{ font-size:12px; color:var(--gold); font-weight:800; margin:14px 0 4px; }
  .warn-box{ font-size:11.5px; color:var(--muted); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; line-height:1.7; margin-bottom:10px; }

  .settings-btn{ position:absolute; right:0; top:0; background:none; border:1px solid var(--line); color:var(--gold); border-radius:10px; padding:5px 10px; font-size:15px; line-height:1.25; font-family:inherit; cursor:pointer; }
  .navbar{ display:flex; align-items:center; gap:10px; margin:12px 0 14px; }
  .navbar:empty{ display:none; }
  .navbar .home-btn{ background:var(--panel); border:1px solid var(--line); color:var(--gold); border-radius:10px; padding:7px 12px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .navbar .ttl{ font-size:15px; font-weight:800; color:var(--text); }
  .sect-title{ font-size:11.5px; color:var(--muted); font-weight:700; margin:18px 2px 8px; display:flex; align-items:center; gap:8px; }
  .sect-title:first-child{ margin-top:6px; }
  .sect-title::after{ content:""; flex:1; height:1px; background:var(--line); }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 10px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; min-height:116px; font-family:inherit; color:var(--text); -webkit-tap-highlight-color:transparent; box-shadow:var(--shadow); }
  .tile:active{ transform:scale(.97); border-color:var(--gold); }
  .tile .ic{ width:48px; height:48px; border-radius:15px; background:linear-gradient(135deg,#E3F3EB,#CFEADD); color:var(--gold); display:flex; align-items:center; justify-content:center; flex:none; padding:12px; }
  .tile .tl{ font-weight:800; font-size:13.5px; }
  .tile .ds{ font-size:10.5px; color:var(--muted); line-height:1.5; }
  .tile.span{ grid-column:1 / -1; flex-direction:row; justify-content:flex-start; text-align:right; gap:14px; min-height:0; padding:12px 14px; }
  .tile.span .tx{ display:flex; flex-direction:column; gap:2px; }
  .opt-row{ display:flex; gap:8px; }
  .opt-row button{ flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted); padding:9px 2px; border-radius:10px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; }
  .opt-row button.active{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .info-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .info-row:last-child{ border-bottom:none; }
  .info-row .k{ color:var(--muted); font-size:12px; }

  /* شريط التنقل السفلي */
  #bottomNav{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:none; background:#fff; border-top:1px solid var(--line); box-shadow:0 -8px 26px rgba(20,70,50,.09); padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); }
  .bn-inner{ max-width:460px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-around; }
  .bn-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; font-family:inherit; color:var(--muted-2); font-size:10.5px; font-weight:700; padding:4px 0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bn-item svg{ width:23px; height:23px; }
  .bn-item.active{ color:var(--gold); }
  .bn-mid{ flex:1; display:flex; justify-content:center; }
  .bn-fab{ width:56px; height:56px; border-radius:50%; background:linear-gradient(180deg,#34A874,#1E7F57); color:#fff; border:4px solid #fff; margin-top:-30px; box-shadow:0 8px 20px rgba(30,127,87,.42); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .bn-fab svg{ width:25px; height:25px; }
  .bn-fab.active{ box-shadow:0 0 0 4px rgba(30,127,87,.22), 0 8px 20px rgba(30,127,87,.42); }
  /* شاشة البداية المتحركة */
  #splash{ position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
    background: linear-gradient(180deg,#F5FCF8,#DCEFE5); transition:opacity .45s ease, visibility .45s; }
  #splash.hide{ opacity:0; visibility:hidden; }
  #splash .bl{ position:absolute; border-radius:34%; background:linear-gradient(135deg,rgba(46,157,110,.28),rgba(46,157,110,.08)); animation: spBlob 7s ease-in-out infinite; }
  #splash .b1{ width:210px; height:210px; right:-70px; top:-50px; } #splash .b2{ width:150px; height:150px; left:-50px; bottom:90px; animation-delay:-2s; }
  #splash .b3{ width:240px; height:240px; right:-90px; bottom:-90px; animation-delay:-4s; } #splash .b4{ width:60px; height:60px; left:40px; top:120px; border-radius:50%; animation-delay:-1s; }
  #splash .sp-wm{ width:250px; position:relative; z-index:1; overflow:visible; }
  #splash .wm-s{ stroke-dasharray:1 2; stroke-dashoffset:1; animation: spDraw .8s cubic-bezier(.5,0,.2,1) forwards; }
  #splash .wm-g{ opacity:0; transform-box:fill-box; transform-origin:center; animation: spGold .7s ease 1.9s forwards; }
  #splash .sp-sub{ position:relative; z-index:1; margin-top:10px; font-size:19px; font-weight:800; color:var(--text); opacity:0; animation: spFade .7s ease 2.0s forwards; }
  #splash .sp-bar{ position:relative; z-index:1; width:120px; height:4px; border-radius:4px; background:rgba(30,127,87,.16); margin-top:30px; overflow:hidden; opacity:0; animation: spFade .5s ease .3s forwards; }
  #splash .sp-bar i{ position:absolute; top:0; bottom:0; width:45%; border-radius:4px; background:var(--gold); animation: spBar 1.3s ease-in-out infinite; }
  @keyframes spDraw{ to{ stroke-dashoffset:0; } }
  @keyframes spGold{ from{ opacity:0; transform:scale(.4) rotate(-12deg); } to{ opacity:1; transform:scale(1) rotate(0); } }
  @keyframes spFade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes spBar{ 0%{ right:-45%; } 100%{ right:100%; } }
  @keyframes spBlob{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-14px) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce){ #splash *{ animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
<div id="splash"><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i><i class="bl b4"></i><svg class="sp-wm" xmlns="http://www.w3.org/2000/svg" viewBox="90 40 540 250"><g fill="none" stroke="#1E7F57" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"><path d="M478 122 C522 114 570 118 590 148 C604 176 576 206 528 206 L468 206" pathLength="1" class="wm-s" style="animation-delay:0.15s"/><path d="M424 66 L424 206" pathLength="1" class="wm-s" style="animation-delay:0.60s"/><circle cx="330" cy="152" r="30" pathLength="1" class="wm-s" style="animation-delay:0.90s"/><path d="M358 170 C366 222 340 252 288 250" pathLength="1" class="wm-s" style="animation-delay:1.15s"/><circle cx="176" cy="152" r="30" pathLength="1" class="wm-s" style="animation-delay:1.35s"/><path d="M204 170 C212 222 186 252 134 250" pathLength="1" class="wm-s" style="animation-delay:1.60s"/></g><path class="wm-g" d="M286 236 C252 268 214 270 190 258 C226 258 252 248 262 222 Z" fill="#C9A24B"/></svg><div class="sp-sub">مرضاكم بالصدقة</div><div class="sp-bar"><i></i></div></div>
<div class="wrap">
  <header id="headerBox" class="auth"></header>

  <div id="authScreen"></div>
  <div id="appScreen" style="display:none">
    <div class="navbar" id="navbar"></div>
    <div id="content"></div>
  </div>
  <div id="modalRoot"></div>
<nav id="bottomNav"><div class="bn-inner" id="bnInner"></div></nav>

  <footer>بيانات كل الصناديق متزامنة أونلاين بين كل الأجهزة</footer>
</div>

<script>
"use strict";

/* ======================= إعداد السيرفر ======================= */
var API_URL = "https://daawo-api.labds.workers.dev";

var token = null;
function loadToken(){ try{ return localStorage.getItem("daawo_token"); }catch(e){ return null; } }
function saveToken(t){ token = t; try{ if(t) localStorage.setItem("daawo_token", t); else localStorage.removeItem("daawo_token"); }catch(e){} }

function api(method, path, body){
  if(API_URL.indexOf("PUT_WORKER_URL_HERE")!==-1){
    return Promise.reject(Object.assign(new Error("لسه ما حطيتش رابط السيرفر في الملف (API_URL)"), {status:0}));
  }
  var headers = {"Content-Type":"application/json"};
  if(token) headers["Authorization"] = "Bearer " + token;
  return fetch(API_URL.replace(/\/+$/,"") + path, {
    method: method, headers: headers, body: body ? JSON.stringify(body) : undefined
  }).catch(function(){
    throw Object.assign(new Error("تعذر الاتصال بالسيرفر. تأكد من الإنترنت"), {status:0});
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){
        var e = new Error(d.error || "حصل خطأ"); e.status = r.status;
        if(r.status===401 && token){ forceLogout(); }
        throw e;
      }
      return d;
    });
  });
}

function fmtNum(n){ return (Number(n)||0).toLocaleString("ar-EG"); }
function fmtD(ts){ return new Date(ts).toLocaleDateString("ar-EG",{year:"numeric",month:"2-digit",day:"2-digit"}); }
function fmtT(ts){ return new Date(ts).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}); }
function fmtTime(ts){
  if(!ts) return "";
  var d = new Date(ts);
  return d.toLocaleDateString("ar-EG",{day:"numeric",month:"short"}) + " - " + d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
}
function ymd(d){ var m=d.getMonth()+1, day=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function showErr(id, msg){ var el = document.getElementById(id); el.textContent = msg; el.style.display = "block"; }
function toast(msg){
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2300);
}

var busyEl = null;

function setBusy(msg){
  if(!busyEl){ busyEl = document.createElement("div"); busyEl.className = "busy"; document.body.appendChild(busyEl); }
  busyEl.textContent = msg;
}
function clearBusy(){ if(busyEl && busyEl.parentNode){ busyEl.parentNode.removeChild(busyEl); } busyEl = null; }

/* جلب الصناديق (فيها الإجماليات). بترجع true لو في تغيير */
function refreshFunds(){
  return api("GET","/funds").then(function(d){
    var s = JSON.stringify(d.funds);
    var changed = s !== lastFundsJson;
    lastFundsJson = s;
    fundsCache = d.funds.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    return changed;
  });
}
function fundBalance(f){ return Math.round(((Number(f.i)||0)-(Number(f.o)||0))*100)/100; }

/* بيحدّث صلاحيات المستخدم لو المدير غيّرها */
function refreshMe(){
  return api("GET","/me").then(function(d){
    var u = d.user;
    if(!currentUser) return;
    var changed = JSON.stringify(u.perms)!==JSON.stringify(currentUser.perms) || u.role!==currentUser.role || u.displayName!==currentUser.displayName;
    currentUser.perms = u.perms; currentUser.role = u.role; currentUser.displayName = u.displayName;
    if(changed){
      renderHeader(); renderBottomNav();
      if(!tabAllowed(currentTab)) switchTab("home");
      else if(currentTab==="home") renderHome();
      else if(currentTab==="funds"){ if(openFundId) renderFundDetail(openFundId); else renderFundsList(); }
      else if(currentTab!=="settings") switchTab(currentTab);
    }
  });
}

/* تحديث تلقائي كل 30 ثانية (بدل المزامنة اللحظية) */
function startPolling(){ stopPolling(); pollTimer = setInterval(pollTick, 30000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function pollTick(){
  if(!currentUser || document.hidden || busyEl) return;
  if(document.getElementById("modalRoot").innerHTML) return;
  refreshMe().catch(function(){});
  if(currentTab!=="funds") return;
  refreshFunds().then(function(changed){
    if(!changed || currentTab!=="funds") return;
    if(openFundId) renderFundDetail(openFundId); else renderFundsList();
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollTick(); });

/* بيرجع خطوة جوه البرنامج. ولو مفيش خطوات، الضغطة التانية (خلال ثانيتين) بتقفل البرنامج */
function handleBack(){
  if(busyEl) return true;
  var root = document.getElementById("modalRoot");
  if(root.innerHTML.trim()){ root.innerHTML = ""; return true; }
  if(!currentUser){
    if(authView==="recover"){ renderLoginScreen(); return true; }
    return false;
  }
  if(openFundId){ openFundId = null; renderFundsList(); return true; }
  if(currentTab!=="home"){ switchTab("home"); return true; }
  return false;
}
var lastBackAt = 0;
function onBackPressed(){
  try{
    if(handleBack()){ lastBackAt = 0; return "handled"; }
  }catch(e){}
  var now = Date.now();
  if(now - lastBackAt < 2000){ lastBackAt = 0; return "exit"; }
  lastBackAt = now;
  toast("اضغط رجوع مرة تانية للخروج");
  return "warn";
}
function exitApp(){
  var C = window.Capacitor;
  if(C && C.Plugins && C.Plugins.App && C.Plugins.App.exitApp){ C.Plugins.App.exitApp(); return; }
  try{ window.close(); }catch(e){}
  history.back();
}
function setupBackHandler(){
  var C = window.Capacitor;
  if(C && C.Plugins && C.Plugins.App && C.Plugins.App.addListener){
    C.Plugins.App.addListener("backButton", function(){
      if(onBackPressed()==="exit") exitApp();
    });
    return;
  }
  /* نسخة المتصفح */
  try{ history.pushState({daawo:1}, ""); }catch(e){}
  window.addEventListener("popstate", function(){
    var r = onBackPressed();
    if(r==="exit"){ history.back(); return; }
    try{ history.pushState({daawo:1}, ""); }catch(e){}
  });
}

/* ======================= شاشة البداية ======================= */
var splashStart = Date.now();
function hideSplash(){
  var el = document.getElementById("splash");
  if(!el || el.classList.contains("hide")) return;
  var wait = Math.max(0, 2600 - (Date.now() - splashStart));
  setTimeout(function(){
    el.classList.add("hide");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 600);
  }, wait);
}
setTimeout(hideSplash, 12000);

function renderAuthLoading(msg){

  el.style.display = "block";
  el.innerHTML = '<div class="loading">'+esc(msg||"جاري التحميل...")+'</div>';
}
function renderAuthError(msg, retry){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML = '<div class="card"><div class="empty">'+esc(msg)+'</div><button class="full-btn" id="retryBtn">إعادة المحاولة</button></div>';

}

function startSession(u){
  currentUser = { uid:u.username, username:u.username, displayName:u.displayName, role:u.role, perms:u.perms || {} };
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
  currentTab = "home"; openFundId = null; lastFundsJson = "";
  renderHeader();
  switchTab("home");
  startPolling();
hideSplash();}

function boot(){
  resetHeader();
  applyZoom();
  token = loadToken();
  if(!token){ showLoggedOut(); return; }
  renderAuthLoading("جاري تحميل بياناتك...");
  api("GET","/me").then(function(d){ startSession(d.user); }).catch(function(e){
    if(e.status===401){ return; } /* forceLogout بيعرض شاشة الدخول */
    renderAuthError(e.message, boot);
  });
}

function forceLogout(){
  saveToken(null);
  currentUser = null;
  stopPolling();
  document.getElementById("modalRoot").innerHTML = "";
  resetHeader();
  renderBottomNav();
  showLoggedOut();
}

/* ======================= الشريط السفلي ======================= */
function renderBottomNav(){
  var nav = document.getElementById("bottomNav");
  var hb = document.getElementById("headerBox"); if(hb && hb.classList.contains("hero")) hb.classList.toggle("compact", currentTab!=="home");
  if(!currentUser){ nav.style.display = "none"; return; }
  nav.style.display = "block";
  var items = [
    {k:"home", l:"الرئيسية", i:"home", on:currentTab==="home"},
    {k:"funds", l:"الصناديق", i:"wallet", on:currentTab==="funds"}
  ];
  var html = "";
  function btn(o){ return '<button class="bn-item'+(o.on?' active':'')+'" data-bn="'+o.k+'">'+ic(o.i)+'<span>'+o.l+'</span></button>'; }
  html += btn(items[0]) + btn(items[1]);
  if(can("reports")) html += '<div class="bn-mid"><button class="bn-fab'+(currentTab==="stats"?' active':'')+'" data-bn="stats" aria-label="الإحصائيات">'+ic("stats")+'</button></div>';
  if(can("reports") || can("print")) html += btn({k:"reports", l:"التقارير", i:"reports", on:currentTab==="reports"});
  html += btn({k:"settings", l:"الإعدادات", i:"settings", on:currentTab==="settings"});
  var inner = document.getElementById("bnInner");
  inner.innerHTML = html;
  Array.prototype.forEach.call(inner.querySelectorAll("[data-bn]"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-bn");
      if(k==="funds") goFunds(currentTab==="funds" ? catFilter : "patient"); else switchTab(k);
    };
  });
}

/* أزرار الأقسام: كل زر بيفتح صفحة صناديق القسم ده */
var CAT_SCREENS = {
  patient:   {label:"صناديق المرضى",   icon:"patient", desc:"تبرعات ومصروفات كل مريض"},
  emergency: {label:"تبرعات طارئة",    icon:"emergency", desc:"الحالات الطارئة"},
  gaza:      {label:"غزة",             icon:"gaza", desc:"صناديق غزة"}
};
var GROUPS = [
  {key:"funds",   title:"الصناديق"},
  {key:"reports", title:"الإحصائيات والتقارير"},
  {key:"admin",   title:"الإدارة"},
  {key:"account", title:"الحساب"}
];
function tabsFor(){
  var items = [];
  CATS.forEach(function(c){
    var o = CAT_SCREENS[c.key];
    items.push({key:"cat:"+c.key, label:o.label, icon:o.icon, desc:o.desc, group:"funds"});
  });
  var keys = [];
  if(can("reports")) keys.push("stats");
  if(can("reports") || can("print")) keys.push("reports");
  if(currentUser.role==="admin") keys.push("users");
  if(can("editTx")) keys.push("trash");
  if(currentUser.role==="admin"){ keys.push("audit"); keys.push("backup"); }
  keys.push("settings");
  keys.forEach(function(k){ var o = SCREENS[k]; items.push({key:k, label:o.label, icon:o.icon, desc:o.desc, group:o.group}); });
  return items;
}
function tabAllowed(key){ return key==="home" || key==="funds" || tabsFor().some(function(t){ return t.key===key; }); }
function goFunds(cat){ catFilter = cat; switchTab("funds"); }

/* الشريط اللي فوق: زر الرئيسية + اسم الشاشة (مخفي في الصفحة الرئيسية) */
function renderNav(){
  var bar = document.getElementById("navbar");
  if(currentTab==="home"){ bar.innerHTML = ""; return; }
  var sc = SCREENS[currentTab] || {label:""};
  if(currentTab==="funds") sc = CAT_SCREENS[catFilter] || sc;
  bar.innerHTML = '<button class="home-btn" id="homeBtn">‹ الرئيسية</button><div class="ttl"><span class="t-ic">'+ic(sc.icon)+'</span>'+esc(sc.label)+'</div>';
  document.getElementById("homeBtn").onclick = function(){ switchTab("home"); };
}

/* الصفحة الرئيسية: كل الأزرار متقسمة مجموعات */
function renderHome(){
  var items = tabsFor();
  var html = "";
  GROUPS.forEach(function(g){
    var list = items.filter(function(t){ return t.group===g.key; });
    if(!list.length) return;
    html += '<div class="sect-title">'+g.title+'</div><div class="tiles">';
    list.forEach(function(t, i){
      var span = (list.length===1) || (list.length%2===1 && i===list.length-1);
      html += '<button class="tile'+(span?' span':'')+'" data-go="'+t.key+'"><div class="ic">'+ic(t.icon)+'</div>'+
        '<div class="tx"><div class="tl">'+esc(t.label)+'</div><div class="ds">'+esc(t.desc)+'</div></div></button>';
    });
    html += '</div>';
  });
  var c = document.getElementById("content");
  c.innerHTML = (can("reports") ? '<div class="home-stats" id="homeStats"></div>' : '') + html;
  if(can("reports")){
    var drawStats = function(){
      var el = document.getElementById("homeStats"); if(!el || currentTab!=="home") return;
      var i = 0, o = 0; fundsCache.forEach(function(f){ i += Number(f.i)||0; o += Number(f.o)||0; });
      el.innerHTML = '<div class="hs"><div class="l">التبرعات</div><div class="v">'+fmtNum(round2(i))+'</div></div>'+
        '<div class="hs out"><div class="l">المصروفات</div><div class="v">'+fmtNum(round2(o))+'</div></div>'+
        '<div class="hs bal"><div class="l">الرصيد</div><div class="v">'+fmtNum(round2(i-o))+'</div></div>';
    };
    drawStats();
    refreshFunds().then(drawStats).catch(function(){});
  }
  Array.prototype.forEach.call(c.querySelectorAll("[data-go]"), function(b){
    b.onclick = function(){
      var go = b.getAttribute("data-go");
      if(go.indexOf("cat:")===0) goFunds(go.slice(4)); else switchTab(go);
    };
  });
}

function switchTab(key){
  currentTab = key; openFundId = null;
  renderNav();
  renderBottomNav();
  window.scrollTo(0, 0);
  if(key==="home") renderHome();
  else if(key==="funds"){
    document.getElementById("content").innerHTML = '<div class="loading">جاري التحميل...</div>';
    refreshFunds().then(function(){ if(currentTab==="funds") renderFundsList(); })
      .catch(function(e){ document.getElementById("content").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
  }
  else if(key==="reports") renderReports();
  else if(key==="stats") renderStats();
  else if(key==="users") renderUsersScreen();
  else if(key==="trash") renderTrashScreen();
  else if(key==="audit") renderAuditScreen();
  else if(key==="backup") renderBackupScreen();
  else if(key==="settings") renderSettingsScreen();
}

/* ======================= الصناديق ======================= */
function renderFundsList(){
  var c = document.getElementById("content");
  var filtered = fundsCache.filter(function(f){ return f.category===catFilter; });

  var html = "";

  if(can("manageFunds")){
    html += '<button class="full-btn" id="addFundBtn" style="margin-bottom:12px">+ إضافة صندوق جديد</button>';
  }

  if(!filtered.length){
    html += '<div class="empty">لا توجد صناديق في «'+esc(catLabel(catFilter))+'» بعد</div>';
  } else {
    filtered.forEach(function(f){
      html += '<div class="fund-card'+(f.status==="closed"?' closed':'')+'" data-id="'+esc(f.id)+'">'+
        '<div><div class="name">'+esc(f.name)+(f.status==="closed"?' (مغلق)':'')+'</div>'+
        (f.subcategory?'<div class="sub">'+esc(f.subcategory)+'</div>':'')+'</div>'+
        '<div class="bal">'+fmtNum(fundBalance(f))+' ج</div></div>';
    });
  }
  c.innerHTML = html;

  var addBtn = document.getElementById("addFundBtn");
  if(addBtn) addBtn.onclick = openAddFundModal;

  Array.prototype.forEach.call(c.querySelectorAll(".fund-card"), function(card){
    var id = card.getAttribute("data-id");
    card.onclick = function(){ openFundId = id; renderFundDetail(id); };
  });
}

function afterChange(){
  return refreshFunds().then(function(){
    if(currentTab!=="funds") return;
    if(openFundId) renderFundDetail(openFundId); else renderFundsList();
  });
}

function openAddFundModal(){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>إضافة صندوق جديد</h3>'+
    '<div class="field"><label>اسم الصندوق</label><input id="nf_name" placeholder="'+(catFilter==="gaza"?"مثلاً: اسم الصندوق أو الحملة":"مثلاً: اسم المريض أو الحالة")+'"></div>'+
    '<div class="err" id="nf_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="nf_cancel">إلغاء</button>'+
    '<button class="full-btn" id="nf_save">حفظ</button></div></div></div>';
  document.getElementById("nf_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("nf_save").onclick = function(){
    var name = document.getElementById("nf_name").value.trim();
    if(!name){ showErr("nf_err","اكتب اسم الصندوق"); return; }
    var btn = document.getElementById("nf_save"); btn.disabled = true;
    api("POST","/funds",{name:name, category:catFilter}).then(function(){
      root.innerHTML=""; return afterChange();
    }).catch(function(e){ btn.disabled = false; showErr("nf_err", e.message); });
  };
}

function openEditFundModal(fund){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>تعديل الصندوق</h3>'+
    '<div class="field"><label>اسم الصندوق</label><input id="ef_name" value="'+esc(fund.name)+'"></div>'+
    '<div class="err" id="ef_err"></div>'+
    '<div class="row-actions">'+
    '<button class="btn-flat" id="ef_cancel">إلغاء</button>'+
    '<button class="full-btn" id="ef_save">حفظ</button></div>'+
    '<div class="row-actions" style="margin-top:8px">'+
    '<button class="btn-danger" id="ef_toggle" style="flex:1">'+(fund.status==="closed"?"إعادة فتح الصندوق":"إغلاق الصندوق")+'</button>'+
    (fund.category!=="gaza" ? '<button class="btn-danger" id="ef_del" style="flex:1">نقل للسلة</button>' : '')+
    '</div></div></div>';
  function done(p){ p.then(function(){ root.innerHTML=""; return afterChange(); }).catch(function(e){ showErr("ef_err", e.message); }); }
  document.getElementById("ef_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("ef_save").onclick = function(){
    var name = document.getElementById("ef_name").value.trim();
    if(!name) return;
    done(api("PATCH","/funds/"+fund.id,{name:name}));
  };
  document.getElementById("ef_toggle").onclick = function(){
    done(api("PATCH","/funds/"+fund.id,{status: fund.status==="closed"?"open":"closed"}));
  };
  var efDel = document.getElementById("ef_del");
  if(efDel) efDel.onclick = function(){
    reasonModal("نقل الصندوق للسلة", "الصندوق «"+fund.name+"» هيختفي من القايمة ومن الإجماليات، وتقدر ترجّعه من السلة في أي وقت.", "نقل للسلة", true, function(reason){
      return api("POST","/funds/"+fund.id+"/delete",{reason:reason}).then(function(){
        openFundId = null; toast("اتنقل للسلة ✓"); return afterChange();
      });
    });
  };
}

var curTx = [];
function renderFundDetail(fundId){
  var fund = fundsCache.find(function(f){ return f.id===fundId; });
  var c = document.getElementById("content");
  if(!fund){ c.innerHTML = '<div class="empty">الصندوق غير موجود</div>'; return; }

  var html = '<button class="back-btn" id="backBtn">‹ رجوع إلى '+esc(catLabel(fund.category))+'</button>';
  html += '<div class="card"><h2>'+esc(fund.name)+' '+(can("manageFunds")?'<span id="editFundIcon" style="float:left;cursor:pointer;color:var(--muted);font-size:12px">✎ تعديل</span>':'')+'</h2>';
  html += '<div class="stat-row"><div class="stat"><div class="l">الرصيد الحالي</div><div class="v">'+fmtNum(fundBalance(fund))+' ج</div></div>';
  html += '<div class="stat"><div class="l">إجمالي التبرعات</div><div class="v">'+fmtNum(fund.i)+' ج</div></div></div>';
  if(can("donate")) html += '<button class="full-btn" id="addDonationBtn">+ تسجيل تبرع</button>';
  if(can("expense")) html += '<button class="btn-flat" id="addExpenseBtn" style="width:100%;margin-top:8px">+ تسجيل مصروف</button>';
  html += '</div>';
  if(can("viewLog")){
    html += '<div class="card"><h2>سجل الحركات</h2><div class="list" id="txList"><div class="loading">جاري التحميل...</div></div></div>';
  }
  c.innerHTML = html;

  document.getElementById("backBtn").onclick = function(){ openFundId=null; renderFundsList(); };
  var editIcon = document.getElementById("editFundIcon");
  if(editIcon) editIcon.onclick = function(){ openEditFundModal(fund); };
  var dBtn = document.getElementById("addDonationBtn");
  if(dBtn) dBtn.onclick = function(){ openTxModal(fund, "donation"); };
  var expBtn = document.getElementById("addExpenseBtn");
  if(expBtn) expBtn.onclick = function(){ openTxModal(fund, "expense"); };

  if(!can("viewLog")) return;
  api("GET","/funds/"+fundId+"/tx").then(function(res){
    var list = document.getElementById("txList");
    if(!list || openFundId!==fundId) return;
    var txs = res.tx;
    curTx = txs;
    if(!txs.length){ list.className="list"; list.innerHTML='<div class="empty">لا توجد حركات بعد</div>'; return; }
    list.innerHTML = txs.map(function(t, i){
      var del = !!t.del, meta = "", btns = "";
      if(del) meta = '<div class="tx-meta del">🗑 حذفها '+esc(t.delBy||"")+' - '+fmtTime(t.delAt)+(t.delReason?' | السبب: '+esc(t.delReason):'')+'</div>';
      else if(t.editBy) meta = '<div class="tx-meta">✎ عدّلها '+esc(t.editBy)+' - '+fmtTime(t.editAt)+'</div>';
      if(!del && can("print")) btns += '<button class="mini-btn" data-rc="'+i+'">إيصال PDF</button>';
      if(can("editTx")){
        if(del) btns += '<button class="mini-btn" data-rs="'+i+'">استرجاع</button>';
        else btns += '<button class="mini-btn" data-ed="'+i+'">تعديل</button><button class="mini-btn mini-del" data-dl="'+i+'">حذف</button>';
      }
      if(t.hist && t.hist.length) btns += '<button class="mini-btn" data-hi="'+i+'">السجل</button>';
      return '<div class="tx-row'+(del?' deleted':'')+'"><div class="info"><div class="who">'+esc(t.who||"")+'</div>'+
        (t.note?'<div class="note nt">'+esc(t.note)+'</div>':'')+meta+'</div>'+
        '<div style="text-align:left"><div class="amt '+(t.t==="in"?"in":"out")+'">'+(t.t==="in"?"+":"-")+fmtNum(t.amount)+'</div>'+
        '<div class="note">'+fmtTime(t.ts)+'</div><div class="btns">'+btns+'</div></div></div>';
    }).join("");
    function txAt(b, attr){ return curTx[Number(b.getAttribute(attr))]; }
    Array.prototype.forEach.call(list.querySelectorAll("[data-rc]"), function(b){
      b.onclick = function(){ makeReceipt(fund, txAt(b, "data-rc")); };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-ed]"), function(b){
      b.onclick = function(){ openEditTxModal(fund, txAt(b, "data-ed")); };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-dl]"), function(b){
      b.onclick = function(){
        var t = txAt(b, "data-dl");
        reasonModal("حذف الحركة", (t.t==="in"?"تبرع ":"مصروف ")+fmtNum(t.amount)+" ج هتتنقل للسلة وتفضل ظاهرة مشطوبة في السجل، ومش هتتحسب في الإجماليات.", "حذف (نقل للسلة)", true, function(reason){
          return api("POST","/funds/"+fund.id+"/tx/"+t.id+"/delete",{reason:reason}).then(function(){ toast("اتنقلت للسلة ✓"); return afterChange(); });
        });
      };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-rs]"), function(b){
      b.onclick = function(){
        var t = txAt(b, "data-rs"); b.disabled = true;
        api("POST","/funds/"+fund.id+"/tx/"+t.id+"/restore",{}).then(function(){ toast("تم الاسترجاع ✓"); return afterChange(); })
          .catch(function(e){ b.disabled = false; toast(e.message); });
      };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-hi]"), function(b){
      b.onclick = function(){ showTxHistory(txAt(b, "data-hi")); };
    });
  }).catch(function(e){
    var list = document.getElementById("txList");
    if(list) list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>';
  });
}

function openTxModal(fund, kind){
  var root = document.getElementById("modalRoot");
  var title = kind==="donation" ? "تسجيل تبرع - "+esc(fund.name) : "تسجيل مصروف - "+esc(fund.name);
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>'+title+'</h3>'+
    '<div class="field"><label>المبلغ</label><input id="tx_amt" type="number" inputmode="decimal"></div>'+
    (kind==="donation" ? '<div class="field"><label>اسم المتبرع (اختياري)</label><input id="tx_note"></div>' :
      '<div class="field"><label>بيان المصروف</label><input id="tx_note"></div>')+
    '<div class="err" id="tx_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="tx_cancel">إلغاء</button>'+
    '<button class="full-btn" id="tx_save">حفظ</button></div></div></div>';
  document.getElementById("tx_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("tx_save").onclick = function(){
    var amt = Number(document.getElementById("tx_amt").value);
    var note = document.getElementById("tx_note").value.trim();
    document.getElementById("tx_err").style.display = "none";
    if(!amt || amt<=0){ showErr("tx_err","اكتب مبلغ صحيح"); return; }
    var btn = document.getElementById("tx_save"); btn.disabled = true;
    api("POST","/funds/"+fund.id+"/tx",{kind:kind, amount:amt, note:note}).then(function(res){
      root.innerHTML="";
      afterChange();
      if(can("print") && res.tx) showSavedModal(fund, res.tx);
      else toast("تم الحفظ ✓");
    }).catch(function(e){ btn.disabled = false; showErr("tx_err", e.message); });
  };
}

function showSavedModal(fund, tx){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>تم الحفظ ✓</h3>'+
    '<p class="hint">'+(tx.t==="in"?"التبرع":"المصروف")+' بمبلغ '+fmtNum(tx.amount)+' ج اتسجل في '+esc(fund.name)+'</p>'+
    '<div class="row-actions"><button class="btn-flat" id="sv_close">تم</button>'+
    '<button class="full-btn" id="sv_rc">إيصال PDF</button></div></div></div>';
  document.getElementById("sv_close").onclick = function(){ root.innerHTML=""; };
  document.getElementById("sv_rc").onclick = function(){ root.innerHTML=""; makeReceipt(fund, tx); };
}

/* ======================= محرك PDF ======================= */
function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("load " + src)); };
    document.head.appendChild(s);
  });
}
var pdfLibsP = null;
function ensurePdfLibs(){
  if(window.jspdf && window.html2canvas) return Promise.resolve();
  if(!pdfLibsP){
    pdfLibsP = loadScript("lib/jspdf.umd.min.js")
      .catch(function(){ return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"); })
      .then(function(){
        return loadScript("lib/html2canvas.min.js")
          .catch(function(){ return loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"); });
      })
      .catch(function(){ pdfLibsP = null; throw new Error("تعذر تحميل مكتبة PDF. تأكد من الإنترنت وجرب تاني"); });
  }
  return pdfLibsP;
}

var PDF_FONT = 'direction:rtl;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;color:#111;background:#fff;';

/* بيحوّل صفحات HTML (كل صفحة عنصر واحد بحجم ثابت) لملف PDF */
function htmlPagesToPdf(pages, format){
  return ensurePdfLibs().then(function(){
    var fontsOk = Promise.resolve();
    try{
      if(document.fonts && document.fonts.load){
        fontsOk = Promise.all([document.fonts.load("400 14px Cairo"), document.fonts.load("700 14px Cairo"), document.fonts.load("800 14px Cairo")]).catch(function(){});
      }
    }catch(e){}
    return fontsOk;
  }).then(function(){
    var host = document.createElement("div");
    host.style.cssText = "position:fixed;left:-12000px;top:0;";
    document.body.appendChild(host);
    var pdf = new window.jspdf.jsPDF({unit:"mm", format:format, orientation:"portrait", compress:true});
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    var chain = Promise.resolve();
    pages.forEach(function(html, i){
      chain = chain.then(function(){
        setBusy("جاري تجهيز الصفحة " + fmtNum(i+1) + " من " + fmtNum(pages.length) + "...");
        host.innerHTML = html;
        return window.html2canvas(host.firstChild, {scale:2, backgroundColor:"#ffffff", logging:false});
      }).then(function(canvas){
        if(i>0) pdf.addPage(format, "portrait");
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, pw, ph);
      });
    });
    return chain.then(function(){ host.remove(); return pdf; }, function(e){ host.remove(); throw e; });
  });
}

/* حفظ / مشاركة الـ PDF من الموبايل */
function savePdf(pdf, filename){
  var C = window.Capacitor;
  var native = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share;
  if(native){
    var b64 = pdf.output("datauristring").split(",")[1];
    return C.Plugins.Filesystem.writeFile({path:filename, data:b64, directory:"CACHE"}).then(function(r){
      return C.Plugins.Share.share({title:filename, url:r.uri, dialogTitle:"احفظ أو ابعت الملف"});
    });
  }
  var blob = pdf.output("blob");
  var file = new File([blob], filename, {type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:filename});
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  return Promise.resolve();
}
function pdfDone(p){
  return p.then(function(){ clearBusy(); }, function(e){
    clearBusy();
    var m = String((e && e.message) || e || "");
    if(/cancel|abort/i.test(m)) return;
    toast(m || "حصل خطأ في إنشاء الـ PDF");
  });
}

/* ---------- إيصال ---------- */
function receiptHtml(fund, t){
  var isIn = t.t === "in";
  var no = String(t.id || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 6).toUpperCase();
  function row(l, v){
    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px dashed #cfcfcf;font-size:15px"><span style="color:#666">'+esc(l)+'</span><b style="text-align:left">'+esc(v)+'</b></div>';
  }
  return '<div style="width:559px;height:794px;box-sizing:border-box;padding:28px;'+PDF_FONT+'">'+
    '<div style="border:3px double #1E7F57;height:100%;box-sizing:border-box;padding:26px 24px;position:relative">'+
      '<div style="text-align:center;border-bottom:2px solid #1E7F57;padding-bottom:12px;margin-bottom:18px">'+
        '<div style="font-size:24px;font-weight:800;color:#17624A">داوو مرضاكم بالصدقة</div>'+
        '<div style="font-size:13px;color:#1E7F57;font-weight:700">برويش</div></div>'+
      '<div style="text-align:center;font-size:20px;font-weight:800;margin-bottom:16px">'+(isIn?"إيصال استلام تبرع":"إيصال صرف")+'</div>'+
      row("رقم الإيصال", no || "-")+
      row("التاريخ", fmtD(t.ts)+" - "+fmtT(t.ts))+

/* ---------- تقرير من تاريخ لتاريخ ---------- */
var COLS_TX = [5, 13, 17, 26, 15, 7, 12];
function pRow(cells, widths, o){
  o = o || {};
  var style = "display:flex;height:34px;align-items:center;border-bottom:1px solid #e1e1e1;font-size:12.5px;" +
    (o.head ? "background:#17624A;color:#fff;font-weight:700;" : "") + (o.bg ? "background:" + o.bg + ";" : "") + (o.bold ? "font-weight:800;" : "");
  return '<div style="'+style+'">' + cells.map(function(c, i){
    var col = (o.colors && o.colors[i]) ? "color:" + o.colors[i] + ";" : "";
    return '<div style="flex:'+widths[i]+';padding:0 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'+col+'">'+esc(c)+'</div>';
  }).join("") + '</div>';
}
function lnTitle(t){ return {h:44, need:44+34*2, html:'<div style="height:44px;line-height:52px;font-size:15px;font-weight:800;color:#17624A">'+esc(t)+'</div>'}; }

function paginate(lines, budget){
  var pages = [[]], used = 0;
  lines.forEach(function(L){
    var cur = pages[pages.length-1];
    if(used + (L.need || L.h) > budget && cur.length){
      pages.push([]); used = 0; cur = pages[pages.length-1];
      if(L.hdr){ cur.push(L.hdr); used += L.hdr.h; }
    }
    cur.push(L); used += L.h;
  });
  return pages;
}

/* ---------- تجميع الحركات حسب القسم ---------- */
function fundById(id){ return fundsCache.find(function(f){ return f.id===id; }); }
function catOfTx(t){
  var f = fundById(t.fundId);
  return (f && f.category) || t.category || "other";
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function aggregate(tx){
  var A = {inSum:0, outSum:0, n:tx.length, cats:{}, byWho:{}};
  function cat(k){
    return A.cats[k] || (A.cats[k] = {in:0, out:0, n:0, funds:{}, outByNote:{}});
  }
  tx.forEach(function(t){
    var c = cat(catOfTx(t));
    var f = c.funds[t.fundId] || (c.funds[t.fundId] = {name:t.fundName, in:0, out:0, n:0});
    var amt = Number(t.amount)||0;
    c.n++; f.n++;
    if(t.t==="in"){ A.inSum += amt; c.in += amt; f.in += amt; A.byWho[t.who||"-"] = (A.byWho[t.who||"-"]||0) + amt; }
    else {
      A.outSum += amt; c.out += amt; f.out += amt;
      var key = String(t.note||"").replace(/\s+/g," ").trim() || "بدون بيان";
      var o = c.outByNote[key] || (c.outByNote[key] = {note:key, amount:0, n:0});
      o.amount += amt; o.n++;
    }
  });
  CATS.concat([{key:"other"}]).forEach(function(c){ cat(c.key); });
  A.fundCount = function(k){ return Object.keys(A.cats[k].funds).length; };
  return A;
}
function fetchPeriod(fromV, toV, fundId){
  var from = new Date(fromV + "T00:00:00").getTime();
  var to = new Date(toV + "T23:59:59").getTime() + 999;
  if(!fromV || !toV || isNaN(from) || isNaN(to)) return Promise.reject(new Error("اختار التاريخين"));
  if(to < from) return Promise.reject(new Error("التاريخ غلط: «إلى» لازم يكون بعد «من»"));
  return api("GET", "/report?from=" + from + "&to=" + to + (fundId ? "&fund=" + encodeURIComponent(fundId) : "")).then(function(d){
    d.from = from; d.to = to;
    return d;
  });
}

function reportFrame(pgs, title, sub){

function pBox(label, val, color, isMoney){

}
function boxesLine(boxes){ return {h:92, html:'<div style="display:flex;gap:10px;height:82px;margin-bottom:10px">'+boxes.join("")+'</div>'}; }
function periodSub(o){ return "من " + fmtD(o.from) + " إلى " + fmtD(o.to) + (o.fundName ? " - " + o.fundName : ""); }

/* ---------- التقرير المفصل: كل حاجة بالأسماء والحركات ---------- */
function buildReportPages(data, o){
  var tx = data.tx.filter(function(t){ return o.kind==="all" || t.t===o.kind; });
  var A = aggregate(tx), inSum = A.inSum, outSum = A.outSum, byFund = {}, byWho = A.byWho;
  tx.forEach(function(t){
    var f = byFund[t.fundId] || (byFund[t.fundId] = {name:t.fundName, i:0, o:0});
    if(t.t==="in") f.i += t.amount; else f.o += t.amount;
  });
  var lines = [];

  lines.push(boxesLine([
    (o.kind!=="out"?pBox("إجمالي التبرعات", inSum, "#1d7a46"):""),
    (o.kind!=="in"?pBox("إجمالي المصروفات", outSum, "#b3402c"):""),
    (o.kind==="all"?pBox("الصافي", inSum-outSum, "#17624A"):"")]));
  lines.push({h:26, html:'<div style="font-size:12px;color:#666;height:26px">عدد الحركات: '+fmtNum(tx.length)+'</div>'});

  /* حسب القسم */
  var W0 = [34, 22, 22, 22];
  lines.push(lnTitle("حسب القسم"));
  var hd0 = {h:34, html:pRow(["القسم","عدد الصناديق","التبرعات","المصروفات"], W0, {head:true})};
  lines.push(hd0);
  CATS.concat([{key:"other", label:"أخرى"}]).forEach(function(c){
    var x = A.cats[c.key];
    if(!x || !x.n) return;
    lines.push({h:34, hdr:hd0, html:pRow([c.label, fmtNum(A.fundCount(c.key)), fmtNum(round2(x.in)), fmtNum(round2(x.out))], W0)});
  });

  /* حسب الصندوق */
  var fids = Object.keys(byFund);
  if(fids.length > 1){
    var W1 = [40, 20, 20, 20];
    lines.push(lnTitle("حسب الصندوق"));
    var hd = {h:34, html:pRow(["الصندوق","التبرعات","المصروفات","الصافي"], W1, {head:true})};
    lines.push(hd);
    fids.sort(function(a,b){ return byFund[b].i - byFund[a].i; }).forEach(function(id){
      var f = byFund[id];
      lines.push({h:34, hdr:hd, html:pRow([f.name, fmtNum(f.i), fmtNum(f.o), fmtNum(f.i-f.o)], W1)});
    });
  }
  /* حسب المتطوع */
  var whos = Object.keys(byWho);
  if(o.kind!=="out" && whos.length > 1){
    var W2 = [60, 40];
    lines.push(lnTitle("أداء المتطوعين (مبلغ ما تم تحصيله)"));
    var hd2 = {h:34, html:pRow(["الاسم","المبلغ المحصّل"], W2, {head:true})};
    lines.push(hd2);
    whos.sort(function(a,b){ return byWho[b]-byWho[a]; }).forEach(function(w){
      lines.push({h:34, hdr:hd2, html:pRow([w, fmtNum(byWho[w])+" ج"], W2)});
    });
  }
  /* تفاصيل كل الحركات */
  lines.push(lnTitle("تفاصيل الحركات"));
  var hd3 = {h:34, html:pRow(["م","التاريخ","الصندوق","البيان","المسجِّل","النوع","المبلغ"], COLS_TX, {head:true})};
  lines.push(hd3);
  tx.forEach(function(t, i){
    var isIn = t.t==="in";
    lines.push({h:34, hdr:hd3, html:pRow([fmtNum(i+1), fmtD(t.ts), t.fundName, t.note||"-", t.who||"-", isIn?"تبرع":"مصروف", fmtNum(t.amount)],
      COLS_TX, {colors:{5:isIn?"#1d7a46":"#b3402c"}})});
  });
  return reportFrame(paginate(lines, 870), "التقرير المفصل", periodSub(o));
}

/* ---------- التقرير المختصر: من غير أسماء المرضى ولا الصناديق الطارئة ---------- */
function buildShortPages(data, o){
  var A = aggregate(data.tx), lines = [];
  var P = A.cats.patient, E = A.cats.emergency, G = A.cats.gaza;

  lines.push(boxesLine([pBox("إجمالي الدخل", A.inSum, "#1d7a46"), pBox("إجمالي المصروف", A.outSum, "#b3402c"), pBox("الصافي", A.inSum-A.outSum, "#17624A")]));

  lines.push(lnTitle("صناديق المرضى"));
  lines.push(boxesLine([pBox("عدد المرضى", A.fundCount("patient"), "#17624A", false), pBox("إجمالي الدخل", P.in, "#1d7a46"), pBox("إجمالي المصروف", P.out, "#b3402c")]));

  lines.push(lnTitle("التبرعات الطارئة"));
  lines.push(boxesLine([pBox("عدد الحالات", A.fundCount("emergency"), "#17624A", false), pBox("إجمالي الدخل", E.in, "#1d7a46"), pBox("إجمالي المصروف", E.out, "#b3402c")]));
  var notes = Object.keys(E.outByNote).map(function(k){ return E.outByNote[k]; }).sort(function(a,b){ return b.amount-a.amount; });
  if(!notes.length){
    lines.push({h:34, html:'<div style="height:34px;font-size:12.5px;color:#777">لا توجد مصروفات طارئة في الفترة</div>'});
  } else {
    var WE = [58, 14, 28];
    lines.push({h:30, html:'<div style="height:30px;font-size:12.5px;font-weight:800;color:#444">المصروفات التي تمت (بدون ذكر أسماء الحالات)</div>'});
    var hdE = {h:34, html:pRow(["البيان","العدد","المبلغ"], WE, {head:true})};
    lines.push(hdE);
    notes.forEach(function(n){ lines.push({h:34, hdr:hdE, html:pRow([n.note, fmtNum(n.n), fmtNum(round2(n.amount))+" ج"], WE)}); });
    lines.push({h:34, html:pRow(["الإجمالي", fmtNum(notes.reduce(function(s,n){ return s+n.n; },0)), fmtNum(round2(E.out))+" ج"], WE, {bold:true, bg:"#f3efe7"})});
  }

  lines.push(lnTitle("صناديق التبرعات (غزة)"));
  var gf = Object.keys(G.funds).map(function(k){ return G.funds[k]; }).filter(function(f){ return f.in>0; }).sort(function(a,b){ return b.in-a.in; });
  if(!gf.length){
    lines.push({h:34, html:'<div style="height:34px;font-size:12.5px;color:#777">لا توجد تبرعات في الفترة</div>'});
  } else {
    var WG = [65, 35];
    var hdG = {h:34, html:pRow(["الصندوق","إجمالي التبرعات في الفترة"], WG, {head:true})};
    lines.push(hdG);
    gf.forEach(function(f){ lines.push({h:34, hdr:hdG, html:pRow([f.name, fmtNum(round2(f.in))+" ج"], WG)}); });
    lines.push({h:34, html:pRow(["الإجمالي", fmtNum(round2(G.in))+" ج"], WG, {bold:true, bg:"#f3efe7"})});
  }
  return reportFrame(paginate(lines, 870), "التقرير المختصر", periodSub(o));
}

/* ---------- تنفيذ التقارير ---------- */
function makeReportPdf(type, fromV, toV, opts, errId){
  opts = opts || {};
  setBusy("جاري جلب البيانات...");
  return pdfDone(
    refreshFunds().catch(function(){}).then(function(){ return fetchPeriod(fromV, toV, opts.fundId); }).then(function(d){
      var kind = opts.kind || "all";
      var shown = d.tx.filter(function(t){ return type==="short" || kind==="all" || t.t===kind; });
      if(!shown.length){ throw new Error("مفيش حركات في الفترة دي"); }
      if(d.truncated){ toast("الفترة كبيرة جدًا، الأرقام ناقصة. قلّل الفترة"); }
      var o = {from:d.from, to:d.to, kind:kind, fundName:opts.fundName || ""};
      var pages;
      if(type==="short") pages = buildShortPages(d, o);
      else {
        if(shown.length > 1500){ throw new Error("الحركات كتيرة ("+fmtNum(shown.length)+"). قلّل الفترة أو اختار تقرير مختصر"); }
        pages = buildReportPages(d, o);
      }
      return htmlPagesToPdf(pages, "a4");
    }).then(function(pdf){
      clearBusy();
      return savePdf(pdf, "daawo-" + (type==="short" ? "short" : "detailed") + "-" + fromV.replace(/-/g,"") + "-" + toV.replace(/-/g,"") + ".pdf");
    })
  );
}

        '<div class="field"><label>الصندوق</label><select id="pr_fund"><option value="">كل الصناديق</option>'+opts+'</select></div>'+
        (can("reports") ? '<div class="field"><label>النوع</label><select id="pr_kind"><option value="all">تبرعات ومصروفات</option><option value="in">التبرعات فقط</option><option value="out">المصروفات فقط</option></select></div>' : '')+
        '<div class="err" id="pr_err"></div>'+
        reportBtns("pr")+
        '<p class="hint">'+(can("reports") ?
          'المفصل: كل الحركات بالأسماء والبيانات. المختصر: عدد المرضى وإجمالي الدخل والمصروف لكل قسم، من غير أسماء المرضى ولا الصناديق الطارئة (بيظهر بس المصروفات: معامل، أشعة، عمليات...)، مع صناديق غزة وإجمالي تبرعاتها. المختصر مش بيتأثر باختيار الصندوق والنوع.<br>بعد الإنشاء هتظهر شاشة المشاركة: احفظ الملف أو ابعته من موبايلك.' :
          'التقرير هيشمل التبرعات اللي سجلتها انت بس. بعد الإنشاء احفظ الملف أو ابعته من موبايلك.')+'</p></div>';
    }

    if(can("reports")){
      var byEmployee = {}, totalDonations = 0, totalExpenses = 0;
      fundsCache.forEach(function(f){
        totalDonations += Number(f.i)||0;
        totalExpenses += Number(f.o)||0;
        var emp = f.emp || {};
        Object.keys(emp).forEach(function(n){ byEmployee[n] = (byEmployee[n]||0) + (Number(emp[n])||0); });
      });

      html += '<div class="card"><h2>الإجمالي العام</h2><div class="stat-row">'+
        '<div class="stat"><div class="l">إجمالي التبرعات</div><div class="v">'+fmtNum(totalDonations)+'</div></div>'+
        '<div class="stat"><div class="l">إجمالي المصروفات</div><div class="v">'+fmtNum(totalExpenses)+'</div></div></div></div>';

      html += '<div class="card"><h2>أداء المتطوعين (مبلغ ما تم تحصيله)</h2>';
      var emps = Object.keys(byEmployee).sort(function(a,b){ return byEmployee[b]-byEmployee[a]; });
      if(!emps.length) html += '<div class="empty">لا توجد تبرعات مسجلة بعد</div>';
      else html += emps.map(function(e){
        return '<div class="tx-row"><div class="who">'+esc(e)+'</div><div class="amt in">'+fmtNum(byEmployee[e])+' ج</div></div>';
      }).join("");
      html += '</div>';

      html += '<div class="card"><h2>تفصيل حسب الصندوق</h2>';
      var fundRows = fundsCache.filter(function(f){ return f.i; });
      if(!fundRows.length) html += '<div class="empty">لا توجد بيانات بعد</div>';
      else html += fundRows.map(function(f){
        return '<div class="tx-row"><div class="who">'+esc(f.name)+'</div><div class="amt in">'+fmtNum(f.i)+' ج</div></div>';
      }).join("");
      html += '</div>';
    }

    c.innerHTML = html;
    function dates(){
      document.getElementById("pr_err").style.display = "none";
      return {from:document.getElementById("pr_from").value, to:document.getElementById("pr_to").value};
    }
    var det = document.getElementById("pr_det"), sh = document.getElementById("pr_short");
    if(det) det.onclick = function(){
      var d = dates(), fs = document.getElementById("pr_fund"), ke = document.getElementById("pr_kind");
      if(!d.from || !d.to){ showErr("pr_err","اختار التاريخين"); return; }
      makeReportPdf("detailed", d.from, d.to, {fundId:fs.value, fundName:fs.value ? fs.options[fs.selectedIndex].text : "", kind: ke ? ke.value : "in"});
    };
    if(sh) sh.onclick = function(){
      var d = dates();
      if(!d.from || !d.to){ showErr("pr_err","اختار التاريخين"); return; }
      makeReportPdf("short", d.from, d.to, {});
    };
  }).catch(function(e){ c.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ======================= إدارة الفريق ======================= */
function renderUsersScreen(){
  var c = document.getElementById("content");
  c.innerHTML = '<button class="full-btn" id="addUserBtn" style="margin-bottom:12px">+ إضافة مشرف / متطوع جديد</button>'+
    '<div class="card"><h2>المشرفون والمتطوعون</h2><div id="usersList" class="loading">جاري التحميل...</div></div>';
  document.getElementById("addUserBtn").onclick = openAddUserModal;

  api("GET","/users").then(function(d){
    var list = document.getElementById("usersList");
    if(!list) return;
    var rows = d.users;
    list.className = "";
    if(!rows.length){ list.innerHTML='<div class="empty">لا يوجد مستخدمين</div>'; return; }
    list.innerHTML = rows.map(function(u, i){
      return '<div class="user-row"><div><div class="nm">'+esc(u.displayName)+'</div>'+
        '<div class="meta">@'+esc(u.username)+'</div></div>'+
        '<div class="btns">'+
        '<span class="pill '+esc(u.role)+'">'+esc(ROLE_LABEL[u.role]||u.role)+'</span>'+
        (u.role!=="admin" ? '<button class="btn-flat" data-perm-user="'+i+'" style="flex:none;padding:5px 9px;font-size:11px">الصلاحيات</button>'+
          '<button class="btn-flat" data-toggle="'+esc(u.username)+'" data-active="'+u.active+'" style="flex:none;padding:5px 9px;font-size:11px">'+(u.active?'إيقاف':'تفعيل')+'</button>' : '')+
        '</div></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll("[data-toggle]"), function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-toggle");
        var active = btn.getAttribute("data-active")==="true";
        btn.disabled = true;
        api("PATCH","/users/"+encodeURIComponent(id),{active: !active}).then(function(){ renderUsersScreen(); })
          .catch(function(e){ btn.disabled = false; toast(e.message); });
      };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-perm-user]"), function(btn){
      btn.onclick = function(){ openPermsModal(rows[Number(btn.getAttribute("data-perm-user"))]); };
    });
  }).catch(function(e){
    var list = document.getElementById("usersList");
    if(list){ list.className=""; list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  });
}

/* ======================= أدوات مشتركة (نوافذ التأكيد والسبب) ======================= */
function reasonModal(title, msg, okLabel, required, onOk){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>'+esc(title)+'</h3>'+
    '<p class="hint" style="text-align:right">'+esc(msg)+'</p>'+
    '<div class="field"><label>'+(required?'السبب (مطلوب)':'السبب (اختياري)')+'</label><input id="rs_txt" maxlength="200"></div>'+
    '<div class="err" id="rs_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="rs_cancel">إلغاء</button>'+
    '<button class="btn-danger" id="rs_ok" style="flex:1">'+esc(okLabel)+'</button></div></div></div>';
  document.getElementById("rs_cancel").onclick = function(){ root.innerHTML = ""; };
  document.getElementById("rs_ok").onclick = function(){
    var reason = document.getElementById("rs_txt").value.trim();
    document.getElementById("rs_err").style.display = "none";
    if(required && !reason){ showErr("rs_err", "اكتب السبب"); return; }
    var btn = document.getElementById("rs_ok"); btn.disabled = true;
    onOk(reason).then(function(){ root.innerHTML = ""; }).catch(function(e){ btn.disabled = false; showErr("rs_err", e.message); });
  };
}
function confirmModal(title, msg, okLabel, onOk){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>'+esc(title)+'</h3>'+
    '<p class="hint" style="text-align:right;font-size:12.5px">'+esc(msg)+'</p>'+

    var btn = document.getElementById("cf_ok"); btn.disabled = true;

}
function catLabel(key){ var c = CATS.filter(function(x){ return x.key===key; })[0]; return c ? c.label : ""; }

/* ======================= تعديل حركة + تاريخ التعديلات ======================= */
function openEditTxModal(fund, t){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>تعديل '+(t.t==="in"?"التبرع":"المصروف")+' - '+esc(fund.name)+'</h3>'+
    '<div class="field"><label>المبلغ</label><input id="et_amt" type="number" inputmode="decimal" value="'+esc(t.amount)+'"></div>'+
    '<div class="field"><label>'+(t.t==="in"?"اسم المتبرع":"بيان المصروف")+'</label><input id="et_note" value="'+esc(t.note||"")+'"></div>'+
    '<div class="field"><label>سبب التعديل (اختياري)</label><input id="et_reason" maxlength="200"></div>'+
    '<p class="hint">اسمك ووقت التعديل هيتسجلوا، والقيم القديمة هتفضل محفوظة في "السجل".</p>'+
    '<div class="err" id="et_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="et_cancel">إلغاء</button>'+
    '<button class="full-btn" id="et_save">حفظ التعديل</button></div></div></div>';
  document.getElementById("et_cancel").onclick = function(){ root.innerHTML = ""; };
  document.getElementById("et_save").onclick = function(){
    var amt = Number(document.getElementById("et_amt").value);
    var note = document.getElementById("et_note").value.trim();
    var reason = document.getElementById("et_reason").value.trim();
    document.getElementById("et_err").style.display = "none";
    if(!amt || amt<=0){ showErr("et_err", "اكتب مبلغ صحيح"); return; }
    var body = {};
    if(amt !== t.amount) body.amount = amt;
    if(note !== (t.note||"")) body.note = note;
    if(!Object.keys(body).length){ showErr("et_err", "مغيّرتش أي حاجة"); return; }
    if(reason) body.reason = reason;
    var btn = document.getElementById("et_save"); btn.disabled = true;
    api("PATCH", "/funds/"+fund.id+"/tx/"+t.id, body).then(function(){
      root.innerHTML = ""; toast("تم التعديل ✓"); return afterChange();
    }).catch(function(e){ btn.disabled = false; showErr("et_err", e.message); });
  };
}

    else if(h.a==="delete") txt = esc(h.by)+' حذف الحركة (نقلها للسلة)'+(h.reason?' | السبب: '+esc(h.reason):'');
    else txt = esc(h.by)+' استرجع الحركة من السلة';
    return '<div class="user-row" style="display:block"><div class="nm" style="font-size:12.5px;font-weight:600">'+txt+'</div><div class="meta">'+fmtTime(h.ts)+'</div></div>';
  }).join("");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>تاريخ الحركة</h3>'+

/* ======================= سلة المحذوفات ======================= */
function renderTrashScreen(){
  var c = document.getElementById("content");
  c.innerHTML = '<div class="card"><h2>سلة المحذوفات</h2>'+
    '<div class="warn-box">اللي هنا مش بيتحسب في الإجماليات ولا التقارير. تقدر ترجّعه في أي وقت. '+(currentUser.role==="admin"?'الحذف النهائي للمدير بس، ومبيتراجعش عنه.':'')+'</div>'+
    '<div id="trashBody" class="loading">جاري التحميل...</div></div>';
  api("GET", "/trash").then(function(d){
    var box = document.getElementById("trashBody");
    if(!box || currentTab!=="trash") return;
    box.className = "";
    var isAdmin = currentUser.role==="admin";
    var html = "";
    if(!d.funds.length && !d.tx.length){ box.innerHTML = '<div class="empty">السلة فاضية</div>'; return; }
    if(d.funds.length){
      html += '<div class="sub-title">صناديق محذوفة</div>';
      html += d.funds.map(function(f, i){
        return '<div class="user-row" style="align-items:flex-start;gap:8px"><div><div class="nm">'+esc(f.name)+'</div>'+
          '<div class="meta">'+esc(catLabel(f.category))+' - تبرعات '+fmtNum(f.i)+' ج - مصروفات '+fmtNum(f.o)+' ج</div>'+
          '<div class="tx-meta del">حذفه '+esc(f.delBy||"")+' - '+fmtTime(f.delAt)+(f.delReason?' | '+esc(f.delReason):'')+'</div></div>'+
          '<div class="btns">'+(can("manageFunds")?'<button class="mini-btn" data-rf="'+i+'">استرجاع</button>':'')+
          (isAdmin?'<button class="mini-btn mini-del" data-pf="'+i+'">حذف نهائي</button>':'')+'</div></div>';
      }).join("");
    }
    if(d.tx.length){
      html += '<div class="sub-title">حركات محذوفة</div>';
      html += d.tx.map(function(t, i){
        return '<div class="user-row" style="align-items:flex-start;gap:8px"><div><div class="nm">'+(t.t==="in"?'+':'-')+fmtNum(t.amount)+' ج <span style="font-weight:400;color:var(--muted)">- '+esc(t.fundName)+'</span></div>'+
          '<div class="meta">'+esc(t.who||"")+(t.note?' - '+esc(t.note):'')+' - '+fmtTime(t.ts)+'</div>'+
          '<div class="tx-meta del">حذفها '+esc(t.delBy||"")+' - '+fmtTime(t.delAt)+(t.delReason?' | '+esc(t.delReason):'')+'</div></div>'+
          '<div class="btns"><button class="mini-btn" data-rt="'+i+'">استرجاع</button>'+
          (isAdmin?'<button class="mini-btn mini-del" data-pt="'+i+'">حذف نهائي</button>':'')+'</div></div>';
      }).join("");
    }
    box.innerHTML = html;
    function again(){ renderTrashScreen(); }
    Array.prototype.forEach.call(box.querySelectorAll("[data-rf]"), function(b){
      b.onclick = function(){
        var f = d.funds[Number(b.getAttribute("data-rf"))]; b.disabled = true;
        api("POST", "/funds/"+f.id+"/restore", {}).then(function(){ toast("اتسترجع الصندوق ✓"); again(); }).catch(function(e){ b.disabled = false; toast(e.message); });
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-pf]"), function(b){
      b.onclick = function(){
        var f = d.funds[Number(b.getAttribute("data-pf"))];
        confirmModal("حذف نهائي للصندوق", "الصندوق «"+f.name+"» وكل حركاته هيتمسحوا نهائيًا. هتتاخد نسخة أمان قبل الحذف، والعملية هتتسجل في سجل التدقيق.", "حذف نهائي", function(){
          return api("POST", "/trash/purge", {type:"fund", fundId:f.id}).then(function(){ toast("اتحذف نهائيًا"); again(); });
        });
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-rt]"), function(b){
      b.onclick = function(){
        var t = d.tx[Number(b.getAttribute("data-rt"))]; b.disabled = true;
        api("POST", "/funds/"+t.fundId+"/tx/"+t.id+"/restore", {}).then(function(){ toast("تم الاسترجاع ✓"); again(); }).catch(function(e){ b.disabled = false; toast(e.message); });
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-pt]"), function(b){
      b.onclick = function(){
        var t = d.tx[Number(b.getAttribute("data-pt"))];
        confirmModal("حذف نهائي للحركة", (t.t==="in"?"التبرع ":"المصروف ")+fmtNum(t.amount)+" ج هيتمسح نهائيًا ومش هتقدر ترجّعه. العملية هتتسجل في سجل التدقيق.", "حذف نهائي", function(){
          return api("POST", "/trash/purge", {type:"tx", fundId:t.fundId, txId:t.id}).then(function(){ toast("اتحذفت نهائيًا"); again(); });
        });
      };
    });
  }).catch(function(e){
    var box = document.getElementById("trashBody");
    if(box){ box.className = ""; box.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  });
}
