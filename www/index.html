  fund_restore:"استرجاع صندوق", fund_purge:"حذف نهائي لصندوق",
  tx_edit:"تعديل حركة", tx_delete:"حذف حركة (للسلة)", tx_restore:"استرجاع حركة", tx_purge:"حذف نهائي لحركة",
  user_add:"إضافة مستخدم", user_active:"تفعيل / إيقاف مستخدم", user_perms:"تغيير صلاحيات",
  backup_create:"نسخة احتياطية", backup_download:"تنزيل نسخة", backup_restore:"استرجاع نسخة", admin_recover:"استرجاع حساب المدير", password_change:"تغيير كلمة السر"
};
function actClass(a){
  if(/_delete$|_purge$|backup_restore|admin_recover/.test(a)) return "bad";
  if(/_restore$/.test(a)) return "good";
  return "";
}
var auditCursor = null;
function renderAuditScreen(){
  var c = document.getElementById("content");
  auditCursor = null;
  c.innerHTML = '<div class="card"><h2>سجل التدقيق</h2>'+
    '<div class="warn-box">كل تعديل أو حذف أو استرجاع على الصناديق والحركات والمستخدمين والنسخ الاحتياطية، باسم اللي عمله ووقته. السجل للقراءة بس.</div>'+
    '<div id="auditList" class="loading">جاري التحميل...</div><div id="auditMore"></div></div>';
  loadAudit(true);
}
function loadAudit(first){
  api("GET", "/audit" + (auditCursor ? "?cursor="+encodeURIComponent(auditCursor) : "")).then(function(d){
    var list = document.getElementById("auditList");
    if(!list || currentTab!=="audit") return;
    list.className = "";
    var html = d.items.map(function(e){
      var cls = actClass(e.act);
      return '<div class="user-row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center">'+
        '<div class="nm">'+esc(e.tg||"")+'</div><span class="pill '+cls+'">'+esc(ACT_LABEL[e.act]||e.act)+'</span></div>'+
        (e.d?'<div class="meta" style="margin-top:3px">'+esc(e.d)+'</div>':'')+
        '<div class="meta" style="margin-top:2px">'+esc(e.by)+' - '+fmtTime(e.ts)+'</div></div>';
    }).join("");
    if(first) list.innerHTML = html || '<div class="empty">لا توجد أحداث بعد</div>';
    else list.insertAdjacentHTML("beforeend", html);
    auditCursor = d.cursor || null;
    var more = document.getElementById("auditMore");
    more.innerHTML = auditCursor ? '<button class="btn-flat" id="auditMoreBtn" style="width:100%;margin-top:10px">عرض المزيد</button>' : '';
    var mb = document.getElementById("auditMoreBtn");
    if(mb) mb.onclick = function(){ mb.disabled = true; loadAudit(false); };
  }).catch(function(e){
    var list = document.getElementById("auditList");
    if(list){ list.className = ""; list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  });
}

/* ======================= النسخ الاحتياطي ======================= */
var KIND_LABEL = {auto:"تلقائية يومية", manual:"يدوية", safety:"أمان (قبل استرجاع/حذف نهائي)"};
function fmtSize(b){ b = Number(b)||0; return b>1048576 ? (b/1048576).toFixed(1)+" م.ب" : Math.max(1,Math.round(b/1024))+" ك.ب"; }
function saveJson(text, filename){
  var C = window.Capacitor;
  var native = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Filesystem && C.Plugins.Share;
  if(native){
    var b64 = btoa(unescape(encodeURIComponent(text)));
    return C.Plugins.Filesystem.writeFile({path:filename, data:b64, directory:"CACHE"}).then(function(r){
      return C.Plugins.Share.share({title:filename, url:r.uri, dialogTitle:"احفظ النسخة الاحتياطية في مكان آمن"});
    });
  }
  var blob = new Blob([text], {type:"application/json"});
  var file = new File([blob], filename, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:filename});
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  return Promise.resolve();
}
function saveJsonDone(p){
  return p.then(function(){ clearBusy(); }, function(e){
    clearBusy();
    var m = String((e && e.message) || e || "");
    if(/cancel|abort/i.test(m)) return;
    toast(m || "حصل خطأ في حفظ الملف");
  });
}
function pickJsonFile(cb){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ cb(null, String(rd.result)); };
    rd.onerror = function(){ cb(new Error("تعذر قراءة الملف")); };
    rd.readAsText(f);
  };
  inp.click();
}
function afterRestore(){
  toast("تم الاسترجاع ✓");
  lastFundsJson = "";
  return refreshMe().catch(function(){}).then(function(){ switchTab("home"); });
}
function renderBackupScreen(){
  var c = document.getElementById("content");
  c.innerHTML =
    '<div class="card"><h2>النسخ الاحتياطي</h2>'+
    '<div class="warn-box">السيرفر بياخد نسخة تلقائية مرة كل يوم (عند أول تعديل في اليوم) ويحتفظ بآخر 14 نسخة. تقدر كمان تاخد نسخة يدوية أو تنزّل نسخة على موبايلك. ملف النسخة فيه بيانات الحسابات (كلمات السر مشفّرة)، فاحفظه في مكان آمن.</div>'+
    '<button class="full-btn" id="bk_now">+ نسخة احتياطية الآن</button>'+
    '<div class="row-actions"><button class="btn-flat" id="bk_dl">تنزيل نسخة على الجهاز</button>'+
    '<button class="btn-flat" id="bk_file">استرجاع من ملف</button></div></div>'+
    '<div class="card"><h2>النسخ المحفوظة على السيرفر</h2><div id="bkList" class="loading">جاري التحميل...</div></div>';

  document.getElementById("bk_now").onclick = function(){
    var b = this; b.disabled = true;
    api("POST", "/backups", {}).then(function(){ toast("تم عمل النسخة ✓"); renderBackupScreen(); })
      .catch(function(e){ b.disabled = false; toast(e.message); });
  };
  document.getElementById("bk_dl").onclick = function(){
    setBusy("جاري تجهيز النسخة...");
    saveJsonDone(api("GET", "/backup/export").then(function(d){
      return saveJson(JSON.stringify(d), "daawo-backup-" + ymd(new Date()) + ".json");
    }));
  };
  document.getElementById("bk_file").onclick = function(){
    pickJsonFile(function(err, text){
      if(err){ toast(err.message); return; }
      var snap;
      try{ snap = JSON.parse(text); }catch(e){ toast("الملف ده مش نسخة احتياطية صالحة"); return; }
      if(!snap || snap.v!==1 || !snap.data){ toast("الملف ده مش نسخة احتياطية صالحة"); return; }
      var nF = (snap.data.funds||[]).length;
      confirmModal("استرجاع من ملف", "هتتبدّل كل البيانات الحالية (الصناديق والحركات والمستخدمين) ببيانات الملف ("+fmtNum(nF)+" صندوق، بتاريخ "+fmtD(snap.ts||0)+"). هتتاخد نسخة أمان من الوضع الحالي الأول.", "استرجاع", function(){
        return api("POST", "/restore", {snapshot:snap}).then(afterRestore);
      });
    });
  };

  api("GET", "/backups").then(function(d){
    var list = document.getElementById("bkList");
    if(!list || currentTab!=="backup") return;
    list.className = "";
    var rows = d.backups;
    if(!rows.length){ list.innerHTML = '<div class="empty">مفيش نسخ لسه. أول نسخة تلقائية هتتاخد عند أول تعديل.</div>'; return; }
    list.innerHTML = rows.map(function(b, i){
      return '<div class="user-row" style="align-items:flex-start;gap:8px"><div>'+
        '<div class="nm">'+fmtD(b.ts)+' - '+fmtT(b.ts)+'</div>'+
        '<div class="meta"><span class="pill '+(b.kind==="safety"?'bad':(b.kind==="manual"?'good':''))+'">'+esc(KIND_LABEL[b.kind]||b.kind)+'</span> '+esc(b.by||"")+'</div>'+
        '<div class="meta">'+fmtNum(b.funds)+' صندوق - '+fmtNum(b.tx)+' حركة - '+fmtSize(b.size)+'</div></div>'+
        '<div class="btns"><button class="mini-btn" data-bd="'+i+'">تنزيل</button>'+
        '<button class="mini-btn mini-del" data-br="'+i+'">استرجاع</button></div></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll("[data-bd]"), function(btn){
      btn.onclick = function(){
        var b = rows[Number(btn.getAttribute("data-bd"))];
        setBusy("جاري تجهيز الملف...");
        saveJsonDone(api("GET", "/backups/"+b.id+"/download").then(function(snap){
          return saveJson(JSON.stringify(snap), "daawo-backup-" + b.id + ".json");
        }));
      };
    });
    Array.prototype.forEach.call(list.querySelectorAll("[data-br]"), function(btn){
      btn.onclick = function(){
        var b = rows[Number(btn.getAttribute("data-br"))];
        confirmModal("استرجاع نسخة", "هترجّع كل البيانات لحالتها يوم "+fmtD(b.ts)+" الساعة "+fmtT(b.ts)+" ("+fmtNum(b.funds)+" صندوق، "+fmtNum(b.tx)+" حركة). أي حاجة اتسجلت بعد كده هتختفي من البرنامج، بس هتتاخد نسخة أمان من الوضع الحالي قبل الاسترجاع.", "استرجاع", function(){
          return api("POST", "/backups/"+b.id+"/restore", {}).then(afterRestore);
        });
      };
    });
  }).catch(function(e){
    var list = document.getElementById("bkList");
    if(list){ list.className = ""; list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  });
}

/* ======================= الإعدادات ======================= */
var ZOOM_OPTS = [{v:"1", l:"عادي"}, {v:"1.12", l:"كبير"}, {v:"1.25", l:"كبير جدًا"}];
function getZoom(){ try{ return localStorage.getItem("daawo_zoom") || "1"; }catch(e){ return "1"; } }
function applyZoom(){
  var w = document.querySelector(".wrap");
  if(w) w.style.zoom = getZoom();
}
function renderSettingsScreen(){
  var c = document.getElementById("content");
  var z = getZoom();
  c.innerHTML =
    '<div class="card"><h2>حسابي</h2>'+
      '<div class="info-row"><span class="k">الاسم</span><b>'+esc(currentUser.displayName)+'</b></div>'+
      '<div class="info-row"><span class="k">اسم المستخدم</span><b dir="ltr">@'+esc(currentUser.username)+'</b></div>'+
      '<div class="info-row"><span class="k">الدور</span><span class="pill '+esc(currentUser.role)+'">'+esc(ROLE_LABEL[currentUser.role]||currentUser.role)+'</span></div>'+
    '</div>'+
    '<div class="card"><h2>حجم الخط</h2><div class="opt-row" id="zoomRow">'+
      ZOOM_OPTS.map(function(o){ return '<button data-z="'+o.v+'" class="'+(o.v===z?'active':'')+'">'+o.l+'</button>'; }).join("")+
    '</div><p class="hint">بيتحفظ على الجهاز ده بس.</p></div>'+
    '<div class="card"><h2>تغيير كلمة السر</h2>'+
      '<div class="field"><label>كلمة السر الحالية</label><input id="pw_cur" type="password" autocomplete="current-password"></div>'+
      '<div class="field"><label>كلمة السر الجديدة</label><input id="pw_new" type="password" autocomplete="new-password"></div>'+
      '<div class="field"><label>تأكيد كلمة السر الجديدة</label><input id="pw_new2" type="password" autocomplete="new-password"></div>'+
      '<div class="err" id="pw_err"></div>'+
      '<button class="full-btn" id="pw_save">حفظ كلمة السر</button>'+
      '<p class="hint">بعد التغيير هتتسجل خروج الأجهزة التانية، وجهازك ده هيفضل شغال.</p></div>'+
    '<button class="btn-danger" id="st_logout" style="width:100%;padding:12px;font-size:13.5px">تسجيل الخروج</button>'+
    '<p class="hint" style="margin-top:12px">داوو مرضاكم بالصدقة - برويش</p>';

  Array.prototype.forEach.call(c.querySelectorAll("#zoomRow button"), function(b){
    b.onclick = function(){
      try{ localStorage.setItem("daawo_zoom", b.getAttribute("data-z")); }catch(e){}
      applyZoom();
      Array.prototype.forEach.call(c.querySelectorAll("#zoomRow button"), function(x){ x.classList.toggle("active", x===b); });
    };
  });
  document.getElementById("st_logout").onclick = forceLogout;
  document.getElementById("pw_save").onclick = function(){
    var cur = document.getElementById("pw_cur").value;
    var nw = document.getElementById("pw_new").value;
    var nw2 = document.getElementById("pw_new2").value;
    document.getElementById("pw_err").style.display = "none";
    if(!cur || !nw){ showErr("pw_err", "املى كل الحقول"); return; }
    if(nw.length < 6){ showErr("pw_err", "كلمة السر الجديدة 6 حروف/أرقام على الأقل"); return; }
    if(nw !== nw2){ showErr("pw_err", "تأكيد كلمة السر مش مطابق"); return; }
    var btn = document.getElementById("pw_save"); btn.disabled = true;
    api("POST", "/me/password", {current:cur, next:nw}).then(function(d){
      if(d.token) saveToken(d.token);
      toast("تم تغيير كلمة السر ✓");
      renderSettingsScreen();
    }).catch(function(e){ btn.disabled = false; showErr("pw_err", e.message); });
  };
}

setupBackHandler();
boot();
